<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель магазина</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 20px;
      }
      button {
        display: block;
        margin: 10px 0;
        padding: 10px;
        cursor: pointer;
      }
      input {
        display: block;
        margin: 5px 0;
        padding: 5px;
        width: 300px;
      }
      #product-list {
        margin-top: 20px;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);

        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }
      .modal-buttons {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Админ-панель магазина</h2>

    <button onclick="getProducts()">Получить список товаров</button>
    <div id="product-list"></div>
    <input type="text" id="chat-input" placeholder="Введите сообщение..." />
    <button onclick="sendMessage()">Отправить</button>
    <label>
      <input type="checkbox" id="admin-mode" /> Отправить как администратор
    </label>

    <script>
      const ws = new WebSocket("ws://localhost:5001");

      ws.onmessage = async (event) => {
        const chatBox = document.getElementById("chat-box");

        let text = event.data;
        if (event.data instanceof Blob) {
          text = await event.data.text();
        }

        // Parsing JSON message from the server
        try {
          const message = JSON.parse(text);
          console.log(message);
          const sender = message.admin ? "🛠️ [Админ]" : "👤 [Клиент]";
          chatBox.innerHTML += `<p><strong>${sender}:</strong> ${message.text}</p>`;
        } catch (error) {
          console.error("Ошибка обработки сообщения:", error);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
      };

      function sendMessage() {
        const input = document.getElementById("chat-input");
        const input2 = document.getElementById("chat-input2");
        const isAdmin = document.getElementById("admin-mode").checked;

        if (input.value.trim()) {
          const message = {
            text: input.value,
            admin: true,
          };
          console.log("Admin");
          ws.send(JSON.stringify(message));
          input.value = "";
        }
        if (input2.value.trim()) {
          const message = {
            text: input2.value,
            admin: false,
          };
          ws.send(JSON.stringify(message));

          input2.value = "";
        }
      }
    </script>
    <hr />

    <h3>Добавить товар</h3>
    <input type="text" id="add-id" placeholder="ID товара" />
    <input type="text" id="add-name" placeholder="Название" />
    <input type="number" id="add-price" placeholder="Цена" />
    <input type="text" id="add-description" placeholder="Описание" />
    <input
      type="text"
      id="add-categories"
      placeholder="Категории (через запятую)"
    />
    <button onclick="addProduct()">Добавить</button>

    <hr />

    <h3>Обновить товар</h3>
    <input type="text" id="update-id" placeholder="ID товара" />
    <input type="text" id="update-name" placeholder="Новое название" />
    <input type="number" id="update-price" placeholder="Новая цена" />
    <input type="text" id="update-description" placeholder="Новое описание" />
    <input
      type="text"
      id="update-categories"
      placeholder="Новые категории (через запятую)"
    />
    <button onclick="updateProduct()">Обновить</button>

    <hr />

    <h3>Удалить товар</h3>
    <input type="text" id="delete-id" placeholder="ID товара" />
    <button onclick="openDeleteModal()">Удалить</button>

    <div id="delete-modal" class="modal">
      <div class="modal-content">
        <p>Вы уверены, что хотите удалить этот товар?</p>
        <div class="modal-buttons">
          <button onclick="confirmDelete()">Да</button>
          <button onclick="closeDeleteModal()">Отмена</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:8080/api/products";
      let productIdToDelete = null;

      function openDeleteModal() {
        console.log("ASd");

        productIdToDelete = document.getElementById("delete-id").value;
        document.getElementById("delete-modal").style.display = "flex";
      }

      function closeDeleteModal() {
        document.getElementById("delete-modal").style.display = "none";
      }

      function getProducts() {
        fetch(API_URL)
          .then((response) => response.json())
          .then((data) => {
            let output = "<h4>Список товаров:</h4><ul>";
            data.forEach((product) => {
              output += `<li><strong>${product.name}</strong> - ${product.price}₽ (${product.id})</li>`;
            });
            output += "</ul>";
            document.getElementById("product-list").innerHTML = output;
          })
          .catch((error) =>
            console.error("Ошибка при получении товаров:", error)
          );
      }

      function addProduct() {
        const product = {
          id: document.getElementById("add-id").value,
          name: document.getElementById("add-name").value,
          price: parseFloat(document.getElementById("add-price").value),
          description: document.getElementById("add-description").value,
          categories: document
            .getElementById("add-categories")
            .value.split(",")
            .map((c) => c.trim()),
        };

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(product),
        })
          .then((response) => response.json())
          .then(() => {
            alert("Товар добавлен!");
            getProducts();
          })
          .catch((error) =>
            console.error("Ошибка при добавлении товара:", error)
          );
      }

      function updateProduct() {
        const productId = document.getElementById("update-id").value;
        const updatedProduct = {
          name: document.getElementById("update-name").value,
          price: parseFloat(document.getElementById("update-price").value),
          description: document.getElementById("update-description").value,
          categories: document
            .getElementById("update-categories")
            .value.split(",")
            .map((c) => c.trim()),
        };

        fetch(`${API_URL}/${productId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedProduct),
        })
          .then((response) => {
            if (response.ok) {
              alert("Товар обновлён!");
              getProducts();
            } else {
              alert("Ошибка: товар не найден!");
            }
          })
          .catch((error) =>
            console.error("Ошибка при обновлении товара:", error)
          );
      }

      function confirmDelete() {
        fetch(`${API_URL}/${productIdToDelete}`, { method: "DELETE" })
          .then((response) => {
            if (response.ok) {
              alert("Товар удалён!");
              getProducts();
            } else {
              alert("Ошибка: товар не найден!");
            }
            closeDeleteModal();
          })
          .catch((error) =>
            console.error("Ошибка при удалении товара:", error)
          );
      }
    </script>
    <hr />
    <h3>Чат поддержки</h3>
    <div
      id="chat-box"
      style="
        border: 1px solid #ccc;
        padding: 10px;
        height: 200px;
        overflow-y: auto;
      "
    ></div>
    <input type="text" id="chat-input2" placeholder="Введите сообщение..." />
    <button onclick="sendMessage()">Отправить</button>
  </body>
</html>
